[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lec"
version = "0.1.0"
description = "Linguistic Entropy Coding: reversible ciphertext embedding through language-model sampling"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "LEC authors" }]
keywords = ["steganography", "arithmetic-coding", "language-model", "cryptography", "entropy-coding"]

dependencies = [
    "cryptography>=41.0",
    "fastapi>=0.110",
    "numpy>=1.24",
]

[project.optional-dependencies]
# Everything needed to run a real language model. The core codec and tests
# work without these using the deterministic mock model.
model = [
    "torch>=2.0",
    "transformers==4.44.2",
]
web = [
    "uvicorn[standard]>=0.29",
]
experiments = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]
dev = [
    "pytest>=7.0",
]

[project.scripts]
lec = "lec.cli:main"

[tool.setuptools.packages.find]
include = ["lec*"]

[tool.setuptools.data-files]
"share/lec/web" = ["web/index.html", "web/styles.css", "web/app.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.vercel]
entrypoint = "lec.web:app"
